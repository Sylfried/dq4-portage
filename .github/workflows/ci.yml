# Contrôles minimaux (G-016). Rien ici ne lit ni ne produit de fichier du jeu.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controles:
    name: "Compilation et fichiers interdits"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "Compilation du code (syntaxe de dq4_pc, tests et outils)"
        run: python -m compileall -q dq4_pc tests tools

      - name: "Fichiers interdits (motifs du .gitignore : contenu du jeu, sauvegardes, caches)"
        run: |
          motifs='(^|/)(donnees|jeux|saves|sauvegardes|cache|captures|il2cpp)/|^data/|(^|/)(dump\.cs|script\.json)$|\.(apk|so|unity3d|obb|mpt|dat|pkl)$'
          interdits=$(git ls-files | grep -E "$motifs" || true)
          if [ -n "$interdits" ]; then
            echo "::error::Fichiers interdits dans le dépôt (contenu du jeu, sauvegardes, caches) :"
            echo "$interdits"
            exit 1
          fi
          echo "Aucun fichier interdit."

      - name: "Installation des modules (numpy, unicorn, soundfile)"
        run: python -m pip install --disable-pip-version-check numpy unicorn soundfile

      - name: "Tests sans fenêtre ni jeu (dossiers, migration, états, rencontres, écriture des sauvegardes, décodage du son, priorité des décors, ordre de chargement des états, découpage des feuilles de sprites, ombre du ballon, import des sauvegardes, nom de carte sans données, réglages du moteur non installés, échecs de lecture du son, effet plein écran en 16/9, règle du bruitage des boutons, arrêt de la musique pendant un jingle, lecture circulaire du message, console du lanceur qui se ferme avec le jeu et ses messages en deux langues, catalogue de la version anglaise)"
        run: |
          python tests/test_paths.py
          python tests/test_encounters.py
          python tests/test_save_writing.py
          python tests/test_sound_decoding.py
          python tests/test_fld_priority.py
          python tests/test_savestates_order.py
          python tests/test_special_sheets.py
          python tests/test_balloon_shadow.py
          python tests/test_saves_import.py
          python tests/test_unknown_map.py
          python tests/test_missing_hooks.py
          python tests/test_sound_failures.py
          python tests/test_full_screen_effects.py
          python tests/test_keyboard_sfx.py
          python tests/test_sound_music_limits.py
          python tests/test_message_fallback.py
          python tests/test_focus_loss.py
          python tests/test_sound_volumes.py
          python tests/test_play_time.py
          python tests/test_savestates_whitelist.py
          python tests/test_heap_alert.py
          python tests/test_poker_font.py
          python tests/test_extended_sky.py
          python tests/test_balloon_scale.py
          python tests/test_sepia_scenery.py
          python tests/test_capture_effects.py
          python tests/test_exp_gift_touch.py
          python tests/test_history_key.py
          python tests/test_message_font.py
          python tests/test_save_notifications.py
          python tests/test_stacked_yes_no.py
          python tests/test_saves_in_one_folder.py
          python tests/test_launcher.py
          python tests/test_language.py

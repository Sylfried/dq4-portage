# Contrôles minimaux (G-016). Rien ici ne lit ni ne produit de fichier du jeu.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  controles:
    name: "Compilation et fichiers interdits"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: "Compilation du code (syntaxe de dq4_pc, tests et outils)"
        run: python -m compileall -q dq4_pc tests outils

      - name: "Fichiers interdits (motifs du .gitignore : contenu du jeu, sauvegardes, caches)"
        run: |
          motifs='(^|/)(donnees|jeux|saves|sauvegardes|cache|captures|il2cpp)/|(^|/)(dump\.cs|script\.json)$|\.(apk|so|unity3d|obb|mpt|dat|pkl)$'
          interdits=$(git ls-files | grep -E "$motifs" || true)
          if [ -n "$interdits" ]; then
            echo "::error::Fichiers interdits dans le dépôt (contenu du jeu, sauvegardes, caches) :"
            echo "$interdits"
            exit 1
          fi
          echo "Aucun fichier interdit."

      - name: "Installation des modules (numpy, unicorn, soundfile)"
        run: python -m pip install --disable-pip-version-check numpy unicorn soundfile

      - name: "Tests sans fenêtre ni jeu (dossiers, migration, états, rencontres, écriture des sauvegardes, décodage du son, priorité des décors, ordre de chargement des états, découpage des feuilles de sprites, ombre du ballon)"
        run: |
          python tests/test_chemins.py
          python tests/test_rencontres.py
          python tests/test_ecriture_sauvegarde.py
          python tests/test_son_decodage.py
          python tests/test_fld_priorite.py
          python tests/test_etats_ordre.py
          python tests/test_feuilles_speciales.py
          python tests/test_ombre_ballon.py
